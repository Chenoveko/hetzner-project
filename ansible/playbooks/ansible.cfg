[defaults]
inventory        = /home/ansible/project/ansible/inventories/production/hosts
roles_path       = /home/ansible/project/ansible/roles
private_key_file = /home/ansible/.ssh/ansible_key
collections_path = collections
forks            = 8
interpreter_python = /usr/bin/python3
remote_port      = 2222
gathering = explicit
gather_subset = all
gather_timeout = 10
host_key_checking = False
timeout = 10
log_path = /tmp/ansible.log
strategy = linear

[inventory]
enable_plugins = ini, host_list, virtualbox, yaml, constructed

[privilege_escalation]
#become = True
#become_method = sudo
#become_user = root
#become_ask_pass = True


