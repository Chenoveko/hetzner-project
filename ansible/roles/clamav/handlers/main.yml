---
# handlers file for clamav
- name: Restart clamav-daemon and daemon-reload
  ansible.builtin.systemd_service:
    state: restarted
    daemon_reload: true
    name: clamav-daemon
  become: true

- name: Restart clamav-clamonacc and daemon-reload
  ansible.builtin.systemd_service:
    state: restarted
    daemon_reload: true
    name: clamav-clamonacc
  become: true