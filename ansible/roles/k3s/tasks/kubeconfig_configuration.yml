---
- name: Create .kube directory
  ansible.builtin.file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: '0755'

- name: Fetch kubeconfig from controlpanel
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/k3s.yaml
    flat: true
  delegate_to: controlpanel
  become: true

- name: Copy kubeconfig to cms
  ansible.builtin.copy:
    src: /tmp/k3s.yaml
    dest: /home/ansible/.kube/config
    owner: ansible
    group: ansible
    mode: '0600'

- name: Replace localhost with controlpanel hostname in kubeconfig
  ansible.builtin.replace:
    path: /home/ansible/.kube/config
    regexp: 'https://127\.0\.0\.1:6443'
    replace: 'https://controlpanel:6443'

- name: Remove kubeconfig temp file
  ansible.builtin.file:
    path: /tmp/k3s.yaml
    state: absent
  delegate_to: localhost

- name: Verify cluster nodes are visible from cms
  ansible.builtin.command: kubectl get nodes
  register: kubectl_output
  environment:
    KUBECONFIG: /home/ansible/.kube/config
  become: false

- name: Show cluster nodes
  ansible.builtin.debug:
    msg: "{{ kubectl_output.stdout_lines }}"