---
- name: Create .kube directory
  ansible.builtin.file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: '0755'

- name: Fetch kubeconfig from controlpanel-1
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/k3s.yaml
    flat: true
  delegate_to: controlplane-1
  become: true

- name: Copy kubeconfig to cms
  ansible.builtin.copy:
    src: /tmp/k3s.yaml
    dest: /home/ansible/.kube/config
    owner: ansible
    group: ansible
    mode: '0600'

- name: Replace localhost with controlpanel hostname in kubeconfig
  ansible.builtin.replace:
    path: /home/ansible/.kube/config
    regexp: 'https://127\.0\.0\.1:6443'
    replace: 'https://controlplane-1:6443'

- name: Remove kubeconfig temp file
  ansible.builtin.file:
    path: /tmp/k3s.yaml
    state: absent
  delegate_to: localhost

- name: Get cluster nodes
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: /home/ansible/.kube/config
  register: k8s_nodes

- name: Show nodes
  debug:
    msg: "{{ k8s_nodes.resources | map(attribute='metadata.name') | list }}"