---
# tasks file for roles/k3s
- name: Download script installation of k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0755'

- name: Check if k3s-uninstall script exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-uninstall.sh
  register: k3s_uninstall

- name: Uninstall previous k3s server
  ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
  when: k3s_uninstall.stat.exists

- name: Check if k3s-agent-uninstall script exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-agent-uninstall.sh
  register: k3s_agent_uninstall

- name: Uninstall previous k3s agent
  ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
  when: k3s_agent_uninstall.stat.exists

- name: Show k3s token
  ansible.builtin.debug:
    msg: "K3S_TOKEN={{ hostvars[groups['controlpanels'][0]].k3s_token }}"

- name: Install k3s agent on workers
  ansible.builtin.command: /tmp/k3s_install.sh
  environment:
    K3S_URL: "https://controlpanel:6443"
    K3S_TOKEN: "{{ hostvars[groups['controlpanels'][0]].k3s_token }}"

- name: Remove installation script of k3s
  ansible.builtin.file:
    path: /tmp/k3s_install.sh
    state: absent